<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paradoxe — le quartier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Vue du quartier façon Sims : la scène 3D occupe tout l'écran ; les panneaux flottent par-dessus. */
:root {
  --ciel: #bfe3f2;
  --panneau: rgba(250, 252, 255, .94);
  --panneau-bord: #c9d9e6;
  --encre: #1d2b38;
  --doux: #5d7183;
  --accent: #2f7fd1;
  --accent-clair: #dbeafb;
  --vert: #3fae49;
  --jaune: #e0b21f;
  --rouge: #d6493a;
  --ombre: 0 4px 18px rgba(20, 40, 60, .18);
  --f: "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-chiffres: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ciel: #0f1a24; --panneau: rgba(20, 30, 40, .93); --panneau-bord: #2c3e4f; --encre: #e3ecf3; --doux: #93a8b9;
    --accent: #5aa6f0; --accent-clair: #1f3550; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ciel: #0f1a24; --panneau: rgba(20, 30, 40, .93); --panneau-bord: #2c3e4f; --encre: #e3ecf3; --doux: #93a8b9;
  --accent: #5aa6f0; --accent-clair: #1f3550; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ciel); color: var(--encre); font-family: var(--f); font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; }
.panneau { position: fixed; background: var(--panneau); border: 1px solid var(--panneau-bord); border-radius: 14px; box-shadow: var(--ombre); backdrop-filter: blur(6px); }

/* en haut : titre, terrains, étages */
#haut { top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; }
#haut h1 { font-size: 1.05rem; font-weight: 800; margin: 0; }
#haut h1 span { font-weight: 600; color: var(--doux); }
.puces { display: flex; flex-wrap: wrap; gap: 4px; }
.puces button { border: 1px solid var(--panneau-bord); background: transparent; border-radius: 999px; padding: 3px 11px; font-weight: 700; font-size: .85rem; }
.puces button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
#haut .liens { margin-left: auto; display: flex; gap: 12px; font-size: .82rem; }
#haut .liens a { color: var(--doux); }

/* en bas à gauche : l'horloge */
#horloge { left: 12px; bottom: 12px; padding: 10px 12px; width: 300px; }
#heure { font-family: var(--f-chiffres); font-size: 1.6rem; letter-spacing: .02em; }
#jour { font-weight: 800; color: var(--doux); font-size: .9rem; margin-left: 6px; }
.vitesses { display: flex; gap: 4px; margin: 6px 0; }
.vitesses button { flex: 1; border: 1px solid var(--panneau-bord); background: transparent; border-radius: 8px; padding: 4px 0; font-weight: 800; }
.vitesses button[aria-pressed="true"] { background: var(--vert); border-color: var(--vert); color: #fff; }
#curseur { width: 100%; accent-color: var(--accent); }
.jours { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
.jours button { border: 1px solid var(--panneau-bord); background: transparent; border-radius: 6px; padding: 1px 6px; font-size: .78rem; font-weight: 700; }
.jours button[aria-pressed="true"] { background: var(--accent-clair); border-color: var(--accent); }

/* en bas : les habitants */
#portraits { left: 324px; right: 340px; bottom: 12px; padding: 6px; display: flex; gap: 2px; overflow-x: auto; }
.portrait { flex: 1 0 64px; display: grid; justify-items: center; gap: 2px; border: 2px solid transparent; background: transparent; border-radius: 12px; padding: 4px 2px; }
.portrait[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-clair); }
.portrait .tete { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.05rem; box-shadow: inset 0 0 0 3px var(--anneau, #fff); }
.portrait b { font-size: .8rem; }
.portrait small { display: none; }

/* à droite : l'habitant choisi */
#fiche { right: 12px; bottom: 12px; width: 316px; padding: 12px 14px; max-height: calc(100% - 90px); overflow-y: auto; }
#fiche h2 { margin: 0; font-size: 1.15rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
#fiche h2 .pastille { width: 14px; height: 14px; transform: rotate(45deg); border-radius: 2px; }
#fiche .ou { color: var(--doux); font-size: .82rem; margin: 2px 0 8px; }
#fiche .activite { font-weight: 800; }
#fiche .action { font-size: .86rem; color: var(--doux); margin: 2px 0 6px; }
#fiche .pensee { font-style: italic; font-size: .86rem; background: var(--accent-clair); border-radius: 10px; padding: 5px 9px; margin-bottom: 8px; }
.besoin { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; margin: 4px 0; font-size: .82rem; font-weight: 700; }
.jauge { height: 10px; border-radius: 6px; background: rgba(120, 140, 160, .25); overflow: hidden; }
.jauge i { display: block; height: 100%; border-radius: 6px; transition: width .3s, background .3s; }
#suivre { margin-top: 8px; border: 1px solid var(--panneau-bord); background: transparent; border-radius: 8px; padding: 3px 10px; font-weight: 700; font-size: .82rem; }
#suivre[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }

/* bulle au-dessus de l'habitant choisi */
#bulle { position: fixed; transform: translate(-50%, -100%); pointer-events: none; background: #fff; color: #1d2b38; border-radius: 14px; padding: 5px 10px; font-size: .8rem; font-weight: 700; max-width: 220px; box-shadow: var(--ombre); display: none; }
#bulle::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }
#chargement { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 800; color: var(--doux); }

/* le jeu : le plan de John, le menu d'actions, le résultat */
#john { top: 70px; right: 12px; width: 316px; padding: 10px 14px; max-height: 38%; overflow-y: auto; display: none; }
#john h3 { margin: 0 0 4px; font-size: .95rem; font-weight: 800; }
#john .aide { font-size: .8rem; color: var(--doux); margin: 0 0 6px; }
#john ol { margin: 0; padding-left: 18px; font-size: .82rem; }
#john li { margin: 2px 0; }
#john li button { border: 0; background: none; color: var(--rouge); font-weight: 800; padding: 0 4px; }
#john .boutons { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
#john .boutons button { border: 1px solid var(--panneau-bord); background: transparent; border-radius: 8px; padding: 3px 10px; font-weight: 700; font-size: .8rem; }
#resultat { margin-top: 8px; border-left: 4px solid var(--etat, var(--doux)); padding: 4px 0 4px 10px; font-size: .82rem; }
#resultat b { color: var(--etat); }
#resultat .avenir { font-weight: 800; margin-top: 4px; }
#resultat ul { margin: 4px 0 0; padding-left: 16px; color: var(--doux); }
#menu { position: fixed; width: 0; height: 0; display: none; z-index: 5; }
#menu button { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: .82rem;
  background: var(--panneau); color: var(--encre); box-shadow: var(--ombre); }
#menu button:hover, #menu button:focus-visible { background: var(--accent); color: #fff; }
#menu .centre { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); position: absolute; transform: translate(-50%, -50%); }
#menu form { position: absolute; transform: translate(-50%, 24px); background: var(--panneau); border-radius: 12px; padding: 8px; box-shadow: var(--ombre); display: grid; gap: 6px; width: 260px; }
#menu form input, #menu form select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--panneau-bord); background: transparent; color: inherit; }
#menu form button { position: static; transform: none; background: var(--accent); color: #fff; }
#attente { position: fixed; inset: 0; display: none; place-items: center; background: rgba(10, 20, 30, .35); z-index: 6; color: #fff; font-weight: 800; font-size: 1.1rem; }

@media (max-width: 900px) {
  #portraits { left: 12px; right: 12px; bottom: 150px; }
  #fiche { top: auto; bottom: 230px; width: auto; left: 12px; max-height: 40%; }
  #horloge { width: auto; right: 12px; }
}
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }

<script>
// si le chargement échoue, le dire au lieu de rester sur « Chargement du quartier… »
const echecChargement = t => { const c = document.getElementById("chargement"); if (c) c.textContent = t; };
window.addEventListener("error", e => echecChargement(e.message ? `Erreur : ${e.message}` : `Impossible de charger ${e.target.src || "un script"} (three.js vient de cdn.jsdelivr.net).`), true);
window.addEventListener("unhandledrejection", e => echecChargement(`Erreur : ${e.reason}`));
setTimeout(() => echecChargement("Toujours rien après 20 s : three.js (cdn.jsdelivr.net) ne répond pas ? Ouvre la console (F12) pour voir l'erreur."), 20000);
</script>
</head>
<body>
<div id="scene"></div>
<div id="chargement">Chargement du quartier…</div>
<header id="haut" class="panneau">
  <h1>Paradoxe <span>— le quartier, mars 2010</span></h1>
  <div class="puces" id="terrains" role="group" aria-label="Terrain"></div>
  <div class="puces" id="etages" role="group" aria-label="Étage"></div>
  <div class="puces" id="murs" role="group" aria-label="Murs"></div>
  <nav class="liens"><a href="jouer.html">Jouer John</a><a href="quartier.html">Contrôle</a><a href="divergence.html">Le voyageur</a></nav>
</header>
<section id="horloge" class="panneau" aria-label="Temps">
  <div><span id="heure">07:00</span><span id="jour">lundi 8</span></div>
  <div class="vitesses" role="group" aria-label="Vitesse">
    <button data-v="0" title="Pause (espace)">❚❚</button><button data-v="1" title="Vitesse 1">▶</button><button data-v="2" title="Vitesse 2">▶▶</button><button data-v="3" title="Vitesse 3">▶▶▶</button>
  </div>
  <input id="curseur" type="range" min="0" step="1" aria-label="Instant de la semaine">
  <div class="jours" id="jours"></div>
</section>
<nav id="portraits" class="panneau" aria-label="Habitants"></nav>
<aside id="fiche" class="panneau" aria-live="polite"></aside>
<div id="bulle"></div>
<aside id="john" class="panneau" aria-label="Le plan de John"></aside>
<div id="menu" role="menu"></div>
<div id="attente" role="status">John agit… la semaine est rejouée.</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const D = window.SIMS;
const PJ = D.pas_par_jour;
let N = D.pas[D.habitants[0].id].length;
let T = D.textes;
const JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
const NOMS_BESOINS = { faim: "Faim", soif: "Soif", energie: "Énergie", hygiene: "Hygiène", toilettes: "Vessie", social: "Social", detente: "Détente" };
const F = Object.fromEntries(D.champs.map((c, i) => [c, i]));
const el = (tag, attrs = {}, txt) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; return e; };
const hhmm = i => { const m = (i % PJ) * 5; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
const jourDe = i => { const d = Math.floor(i / PJ); return `${JOURS[d % 7]} ${Number(D.dates[d].slice(8))}`; };

// ---------------------------------------------------------------- état
let t = PJ * 0 + 84;             // lundi 07:00
let vitesse = 1;                 // 0 pause, 1 : 5 s par pas, 2 : 1 s, 3 : 0,12 s
const DUREES = [Infinity, 5, 1, 0.12];
let lot = 0, etage = null, mursBas = false, choisi = "simone-vial", suivre = true;
try { const s = JSON.parse(localStorage.getItem("paradoxe-sims") || "{}"); if (s.choisi) choisi = s.choisi; if (typeof s.mursBas === "boolean") mursBas = s.mursBas; } catch (e) {}
// sims.html#qui=robert-chazal&t=408 : qui suivre, à quel pas de la semaine (un lien vers un instant)
{ const h = new URLSearchParams(location.hash.slice(1)); if (D.pas[h.get("qui")]) choisi = h.get("qui"); if (h.has("t")) t = Math.max(0, Math.min(N - 1, Number(h.get("t")) || 0)); if (h.has("v")) vitesse = Number(h.get("v")) || 0; }
const memoriser = () => { try { localStorage.setItem("paradoxe-sims", JSON.stringify({ choisi, mursBas })); } catch (e) {} };

// ---------------------------------------------------------------- scène
const conteneur = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
conteneur.append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, -3000, 6000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;
controls.minPolarAngle = 0.45; controls.maxPolarAngle = 1.25;
controls.minZoom = 0.5; controls.maxZoom = 4;
controls.screenSpacePanning = false;
const hemi = new THREE.HemisphereLight(0xdfefff, 0x6d6a55, 0.9);
scene.add(hemi);
const soleil = new THREE.DirectionalLight(0xfff1d6, 1.6);
soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048);
Object.assign(soleil.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 120 });
scene.add(soleil, soleil.target);
const lampes = Array.from({ length: 10 }, () => { const l = new THREE.PointLight(0xffc77a, 0, 7, 1.6); scene.add(l); return l; });

let echelle = 9;
let sauter = false;                 // demi-hauteur de la vue, en mètres : un logement, ou une rue
function cadrer() {
  const w = window.innerWidth, h = window.innerHeight, s = echelle;
  camera.left = -s * w / h; camera.right = s * w / h; camera.top = s; camera.bottom = -s;
  camera.updateProjectionMatrix(); renderer.setSize(w, h);
}
window.addEventListener("resize", cadrer); cadrer();

// plan (x vers l'est, y vers le nord) → scène (X, Y en haut, Z = −y)
const P = (x, y, z = 0) => new THREE.Vector3(x, z, -y);

// ---------------------------------------------------------------- matériaux
const mats = {};
const mat = (c, o = {}) => (mats[c + JSON.stringify(o)] ??= new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.85 }, o)));
function couleurSol(p) {
  const n = p.local;
  if (p.zone) return /jardin|potager/.test(n) ? "#7fb35a" : /cour/.test(n) ? "#cbbd9f" : "#b8bcc0";
  if (/cuisine/.test(n)) return "#e9dfc9";
  if (/salle-de-bain|wc|douche/.test(n)) return "#dfe9ee";
  if (/chambre/.test(n)) return "#b9c7dd";
  if (/boutique|reserve/.test(n)) return "#c9c4b6";
  if (/atelier/.test(n)) return "#b7976f";
  if (/veranda/.test(n)) return "#d7c9a6";
  return "#c49a6c";
}
function couleurMeuble(nom) {
  const n = nom.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const R = [[/lit/, "#f3f1ea"], [/canape/, "#b0473a"], [/fauteuil/, "#8a5a3c"], [/table|etabli|bureau|comptoir/, "#9c6b40"], [/television/, "#2a2d33"],
    [/refrigerateur|cuisiniere|evier|lavabo|baignoire|cuvette|douche|chambre froide/, "#eef2f4"], [/armoire|buffet|commode|placard|bibliotheque|meuble|chevet/, "#7c5636"],
    [/rayon|etagere/, "#9aa3ab"], [/vitrine/, "#cfe6ef"], [/plante/, "#3f8f3a"], [/etal|cagette|paniere/, "#c48a3e"], [/coffre/, "#555b63"], [/radio|machine/, "#4a4f57"]];
  return (R.find(([r]) => r.test(n)) || [0, "#a88d6d"])[1];
}

// ---------------------------------------------------------------- terrain
const groupeLot = new THREE.Group(); scene.add(groupeLot);
let murs = [], parNiveau = {}, centreLot = new THREE.Vector3(), piecesLot = [];
function construire(n) {
  groupeLot.clear(); murs = []; parNiveau = {};
  const L = D.lots[n], H = L.hauteur;
  soleil.castShadow = L.type !== "rue";
  if (L.type === "rue") return construireRue(L);
  const ajout = (obj, niv) => { (parNiveau[niv] ??= []).push(obj); groupeLot.add(obj); return obj; };
  // l'emprise
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of L.pieces) { x0 = Math.min(x0, p.rect[0]); y0 = Math.min(y0, p.rect[1]); x1 = Math.max(x1, p.rect[2]); y1 = Math.max(y1, p.rect[3]); }
  centreLot = P((x0 + x1) / 2, (y0 + y1) / 2);
  const sol = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0 + 16, 0.2, y1 - y0 + 16), mat(L.id === "epicerie" || L.id === "thomas" ? "#a9aeb2" : "#8fc06a"));
  sol.position.copy(P((x0 + x1) / 2, (y0 + y1) / 2, -0.12)); sol.receiveShadow = true; groupeLot.add(sol);
  // les pièces : sol de chaque pièce, zones extérieures
  piecesLot = L.pieces;
  for (const p of L.pieces) {
    const [a, b, c, d] = p.rect, z = p.niveau * H;
    const m = new THREE.Mesh(new THREE.BoxGeometry(c - a, p.zone ? 0.04 : 0.1, d - b), mat(couleurSol(p)));
    m.position.copy(P((a + c) / 2, (b + d) / 2, z + (p.zone ? -0.02 : -0.04))); m.receiveShadow = true;
    m.userData = { sol: true, piece: p };
    ajout(m, p.niveau);
  }
  // les murs : sur chaque ligne de mur, découpés aux coins de toutes les pièces ; chaque morceau, une seule fois, sait quelles pièces
  // il borde (leur normale vers l'extérieur) ; moins les portes ; les fenêtres en verre
  const lignes = {};   // (niveau, sens, coordonnée) -> bords de pièces sur cette ligne
  for (const p of L.pieces) {
    if (p.zone) continue;
    const [a, b, c, d] = p.rect, niv = p.niveau;
    for (const [sens, k, s0, s1, nx, ny] of [["h", b, a, c, 0, -1], ["v", c, b, d, 1, 0], ["h", d, a, c, 0, 1], ["v", a, b, d, -1, 0]])
      (lignes[[niv, sens, k.toFixed(2)].join("|")] ??= []).push({ niv, sens, k, s0, s1, n: [nx, ny] });
  }
  const plein = mat("#f1ece3"), verre = mat("#9fd3ee", { transparent: true, opacity: 0.35, roughness: 0.1 });
  for (const bords of Object.values(lignes)) {
    const { niv, sens, k } = bords[0], z = niv * H;
    const coupes = [...new Set(bords.flatMap(e => [e.s0, e.s1]).map(v => +v.toFixed(3)))].sort((u, v) => u - v);
    // les ouvertures de cette ligne : portes et fenêtres, en abscisse le long de la ligne
    const surLigne = seg => sens === "h" ? Math.abs(seg[0][1] - k) < 1e-3 && Math.abs(seg[1][1] - k) < 1e-3 : Math.abs(seg[0][0] - k) < 1e-3 && Math.abs(seg[1][0] - k) < 1e-3;
    const abs = q => sens === "h" ? q[0] : q[1];
    const trous = [...L.portes.filter(d => d.niveau === niv && !d.escalier && surLigne(d.segment)).map(d => ({ s0: Math.min(abs(d.segment[0]), abs(d.segment[1])), s1: Math.max(abs(d.segment[0]), abs(d.segment[1])), type: "porte" })),
                   ...L.fenetres.filter(f => f.niveau === niv && surLigne(f.segment)).map(f => ({ s0: Math.min(abs(f.segment[0]), abs(f.segment[1])), s1: Math.max(abs(f.segment[0]), abs(f.segment[1])), type: f.vitrine ? "vitrine" : "fenetre" }))];
    const troncon = (s0, s1, bas, haut, materiau, normales) => {
      if (s1 - s0 < 0.01) return;
      const m = new THREE.Mesh(new THREE.BoxGeometry(s1 - s0, haut - bas, 0.12), materiau);
      const mx = sens === "h" ? (s0 + s1) / 2 : k, my = sens === "h" ? k : (s0 + s1) / 2;
      m.position.copy(P(mx, my, z + (bas + haut) / 2));
      m.rotation.y = sens === "h" ? 0 : Math.PI / 2;
      m.castShadow = materiau.transparent !== true; m.receiveShadow = true;
      m.userData = { mur: true, bas, haut, z, mx, my, verre: materiau.transparent === true, normales };
      murs.push(m); ajout(m, niv);
    };
    for (let q = 0; q + 1 < coupes.length; q++) {
      const a = coupes[q], b = coupes[q + 1], milieu = (a + b) / 2;
      const normales = bords.filter(e => e.s0 - 1e-3 <= milieu && milieu <= e.s1 + 1e-3).map(e => e.n);
      if (!normales.length) continue;
      // ce morceau, découpé par les ouvertures qui le traversent
      let s = a;
      for (const o of trous.filter(o => o.s1 > a && o.s0 < b).sort((u, v) => u.s0 - v.s0)) {

const vue = new THREE.Vector3();
function couperMurs() {

  const faceRue = mursBas || (0 * -vue.x + 1 * -vue.z > 0.2);

const ligne = (id, i) => D.pas[id][Math.max(0, Math.min(N - 1, i))];

function placer(id, tt) {
  const g = persos[id], u = g.userData;
  const i = Math.floor(tt), f = tt - i, r = ligne(id, i), L = D.lots[lot];
  if (r[F.lot] !== lot) { g.visible = false; return; }
  const visibleEtage = etage ?? nivMax(L);
  g.visible = r[F.niveau] <= visibleEtage;
  const H = L.hauteur, rue = L.type === "rue";
  let x = r[F.x], y = r[F.y], z = r[F.niveau] * H + r[F.z], ang = r[F.angle], pose = r[F.pose], marche = false;
  g.scale.setScalar(rue ? 6 : 1);
  u.nom.visible = rue;
  if (rue) {                   // dans la rue : il avance d'un pas à l'autre
    const s = ligne(id, i + 1);
    if (s[F.lot] === lot && (s[F.x] !== x || s[F.y] !== y)) { x += (s[F.x] - x) * f; y += (s[F.y] - y) * f; ang = Math.atan2(s[F.y] - r[F.y], s[F.x] - r[F.x]); marche = true; pose = 3; }
  }
  // en chemin : les premiers instants du pas, le long du chemin porte par porte
  const ch = r[F.chemin] >= 0 ? D.chemins[r[F.chemin]] : null;
  const part = 0.45;
  if (ch && f < part) {
    const pts = ch.map(([px, py, pn]) => [px, py, pn * H]);
    let tot = 0; const lg = pts.slice(1).map((p, k) => { const l = Math.hypot(p[0] - pts[k][0], p[1] - pts[k][1]) + Math.abs(p[2] - pts[k][2]); tot += l; return l; });
    let s = (f / part) * tot, k = 0;
    while (k < lg.length - 1 && s > lg[k]) { s -= lg[k]; k++; }
    const u2 = lg[k] ? Math.min(1, s / lg[k]) : 1, a = pts[k], b = pts[k + 1];
    x = a[0] + (b[0] - a[0]) * u2; y = a[1] + (b[1] - a[1]) * u2; z = a[2] + (b[2] - a[2]) * u2;
    ang = Math.atan2(b[1] - a[1], b[0] - a[0]); marche = true; pose = 3;
  }

  g.position.copy(P(x, y, z));
  g.rotation.set(0, ang, 0);
  const c = u.corps;
  c.rotation.set(0, 0, 0); c.position.set(0, 0, 0);
  u.jambes.forEach(j => j.rotation.set(0, 0, 0)); u.bras.forEach(b => b.rotation.set(0, 0, 0));
  if (!marche && pose !== 1 && pose !== 2) c.scale.y = 1 + 0.008 * Math.sin(performance.now() / 900);   // il respire
  if (pose === 1) {            // assis : le bassin à la hauteur du siège, les cuisses à l'horizontale
    c.position.y = -0.8;
    u.jambes.forEach(j => { j.rotation.z = Math.PI / 2; });
    u.bras.forEach(b => { b.rotation.z = 0.6; });
  } else if (pose === 2) {     // allongé
    c.rotation.z = Math.PI / 2; c.position.set(0.8, 0.15, 0);
  } else if (marche || pose === 3) {
    const s = Math.sin(performance.now() / 140);
    u.jambes[0].rotation.z = s * 0.5; u.jambes[1].rotation.z = -s * 0.5;
    u.bras[0].rotation.z = -s * 0.4; u.bras[1].rotation.z = s * 0.4;
  }
  // le geste de l'action, une fois installé
  u.livre.visible = u.cartes.visible = false; u.tete.rotation.set(0, 0, 0);
  if (!marche) {
    const k = r[F.geste], now = performance.now(), [bg, bd] = u.bras;
    const s1 = Math.sin(now / 180), s2 = Math.sin(now / 500);
    if (k === 1) { bd.rotation.z = 1.25 + 0.25 * s1; bg.rotation.z = 0.9; }
    else if (k === 2) { bd.rotation.z = 0.9 + 1.0 * Math.max(0, s2); bg.rotation.z = 0.7; }
    else if (k === 3) { bd.rotation.z = bg.rotation.z = 1.1; u.livre.visible = true; u.tete.rotation.z = -0.25; }
    else if (k === 4) { bd.rotation.z = 1.0 + 0.15 * s1; bg.rotation.z = 1.0 - 0.15 * s1; u.tete.rotation.z = -0.3; }
    else if (k === 5) { bd.rotation.z = 0.7 + 0.55 * Math.sin(now / 300); bd.rotation.x = 0.3 * Math.sin(now / 300); bg.rotation.z = 0.4; }
    else if (k === 7) { bd.rotation.z = bg.rotation.z = 0.95; u.tete.rotation.z = 0.12 * Math.sin(now / 700); }
    else if (k === 8) { bd.rotation.z = 2.6 + 0.15 * s1; bg.rotation.z = 2.5 - 0.15 * s1; }
    else if (k === 9) { bd.rotation.z = bg.rotation.z = 1.05; u.cartes.visible = true; }
    else if (k === 10) { bd.rotation.z = 1.5 + 0.35 * Math.max(0, s2); }

    else if (k === 12) { bd.rotation.z = bg.rotation.z = 0.45; u.corps.rotation.x = 0.06 * Math.sin(now / 600); }

const minutes = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
function eclairer(tt) {

  const [lev, cou] = (D.soleil[d] || ["07:00", "18:45"]).map(minutes);
  const jour = Math.max(0, Math.min(1, Math.min((m - lev + 40) / 80, (cou + 40 - m) / 80)));
  const fond = new THREE.Color("#141c33").lerp(new THREE.Color("#a9d8ee"), jour);   // le ciel suit l'heure, pas le thème de la page
  scene.background = fond;

  soleil.target.position.copy(centreLot);
  // lampes des pièces éclairées (la nuit surtout)
  const allumees = (D.lumieres[i] || []).filter(([n]) => n === lot);
  const L = D.lots[lot], visible = etage ?? nivMax(L);
  lampes.forEach((l, k) => {

    l.intensity = 4 * (1 - jour * 0.85);

}

function placerJohn(tt) {
  const i = Math.floor(tt), L = D.lots[lot];
  const x = (D.voyageur || []).find(x => { const d = debutPas(x); return d <= i && i < d + Math.max(1, Math.round(dureeMin(x) / 5)); });
  john.visible = false; john.userData.niveau = null;
  if (!x) return;
  const u = john.userData;
  u.jambes.forEach(j => j.rotation.set(0, 0, 0)); u.bras.forEach(b => b.rotation.set(0, 0, 0)); u.corps.rotation.set(0, 0, 0); u.corps.position.set(0, 0, 0);
  let pos = null, ang = 0;
  if (x.habitant) {
    const r = ligne(x.habitant, i);
    if (r[F.lot] !== lot) return;
    pos = [r[F.x] + 0.7 * Math.cos(r[F.angle]), r[F.y] + 0.7 * Math.sin(r[F.angle]), r[F.niveau] * L.hauteur]; ang = r[F.angle] + Math.PI;
  } else if (L.id === "epicerie") {
    if (x.geste === "crocheter" || x.geste === "forcer") {
      const d = L.portes.find(d => d.entre.includes("epicerie-chazal/cour-epicerie"));
      if (d) { const [[ax, ay], [bx, by]] = d.segment; pos = [(ax + bx) / 2, (ay + by) / 2 + 0.45, 0]; ang = -Math.PI / 2; }
    } else {
      const pc = L.pieces.find(p => p.id === "epicerie-chazal/" + (x.piece || "boutique"));
      if (pc) { pos = [(pc.rect[0] + pc.rect[2]) / 2, (pc.rect[1] + pc.rect[3]) / 2, pc.niveau * L.hauteur]; ang = 0.6; }
    }
    const s = Math.sin(performance.now() / 160);
    if (x.type === "geste") { u.bras[0].rotation.z = 1.2 + s * 0.6; u.bras[1].rotation.z = 1.2 - s * 0.6; u.corps.rotation.z = 0.25; }
  }
  if (!pos) return;
  john.userData.niveau = Math.round(pos[2] / L.hauteur);
  const visible = etage ?? nivMax(L);
  if (pos[2] / L.hauteur > visible) return;
  john.visible = true;
  john.position.copy(P(pos[0], pos[1], pos[2])); john.rotation.set(0, ang, 0);
}

    fetch("/api/sims").then(r => r.json()).then(s => {
      if (!s.pas) { if (plan.length) rejouer(); return; }
      remplacer(s);
      plan = (s.voyageur || []).map(x => Object.fromEntries(Object.entries(x).filter(([k]) => !k.startsWith("_"))));
      garderPlan(); majPlan(); majFiche(true);
    });
  } else if (plan.length) rejouer();
}).catch(() => {});
