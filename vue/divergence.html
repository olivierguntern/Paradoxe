<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le voyageur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
/* Même planche que la vue de la semaine : frise des deux mondes en haut, l'instant choisi et la chaîne des causes en dessous. */
:root {
  --papier: #e9eef0; --planche: #f4f7f8; --encre: #1c2a33; --trait: #3b5466; --trait-leger: #a7b5bd; --trait-fin: #c9d3d8;
  --laiton: #9a6a14; --brique: #9b3f2a; --verre: #3f86ab; --alerte: #b8402e; --nuit: #dde4e8; --regle: #cbd4d9; --mousse: #4f7a3a; --violet: #6b4a9a;
  --f-titre: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-texte: "Barlow Semi Condensed", "Helvetica Neue", Arial, sans-serif;
  --f-pensee: "Newsreader", Georgia, "Times New Roman", serif;
  --f-chiffres: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #0d1519; --planche: #121c22; --encre: #dbe4e9; --trait: #8fb0c2; --trait-leger: #3a4c57; --trait-fin: #26343d;
    --laiton: #e3a943; --brique: #e8866b; --verre: #6db1d4; --alerte: #ec7a62; --nuit: #0f191e; --regle: #26353f; --mousse: #8cc06f; --violet: #b79be6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #0d1519; --planche: #121c22; --encre: #dbe4e9; --trait: #8fb0c2; --trait-leger: #3a4c57; --trait-fin: #26343d;
  --laiton: #e3a943; --brique: #e8866b; --verre: #6db1d4; --alerte: #ec7a62; --nuit: #0f191e; --regle: #26353f; --mousse: #8cc06f; --violet: #b79be6;
  color-scheme: dark;
}
body { background: var(--papier); color: var(--encre); font-family: var(--f-texte); font-size: 15px; line-height: 1.4; margin: 0; padding: 12px 16px 32px; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--laiton); outline-offset: 2px; }
.app { max-width: 1500px; margin: 0 auto; display: grid; gap: 12px; }

.bandeau { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.bandeau h1 { font-family: var(--f-titre); font-weight: 600; font-size: 1.25rem; letter-spacing: .02em; margin: 0; }
.bandeau h1 span { font-weight: 400; color: var(--trait); }
.bandeau a { color: var(--trait); font-size: .85rem; }
.etiq { font-family: var(--f-titre); font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--trait); }
.groupe { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.groupe button { border: 1px solid var(--regle); background: var(--planche); padding: 3px 9px; border-radius: 3px; cursor: pointer; font-size: .85rem;
  display: inline-flex; gap: 6px; align-items: center; }
.groupe button[aria-pressed="true"] { border-color: var(--laiton); box-shadow: inset 0 -2px 0 var(--laiton); }
.pastille { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

.carte { background: var(--planche); border: 1px solid var(--regle); padding: 10px 14px; }
.resume { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 6px 24px; }
.resume .verdict { font-family: var(--f-titre); font-weight: 600; font-size: 1.05rem; display: flex; gap: 8px; align-items: baseline; grid-column: 1 / -1; }
.resume .verdict .pastille { align-self: center; width: 11px; height: 11px; }
.resume p { margin: 0; }
.resume .attendu { font-family: var(--f-pensee); font-style: italic; color: var(--trait); }
.resume ul { margin: 2px 0 0; padding-left: 18px; font-size: .9rem; }
.porte { font-size: .85rem; color: var(--trait); }

.frise-tete { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-bottom: 6px; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem; color: var(--trait); }
.legende span { display: inline-flex; gap: 5px; align-items: center; }
.legende i { width: 14px; height: 7px; display: inline-block; }
.frise svg { width: 100%; display: block; touch-action: pan-y; cursor: crosshair; user-select: none; }
.frise text { font-family: var(--f-titre); fill: var(--trait); }
.frise .nom { font-size: 13px; font-weight: 600; fill: var(--encre); }
.frise .heure { font-size: 11px; font-family: var(--f-chiffres); }
.frise .ligne-pas { stroke: var(--trait-fin); }
.frise .nuit { fill: var(--nuit); }
.frise .curseur { stroke: var(--encre); stroke-width: 1.5; }
.frise .intervention { stroke: var(--alerte); stroke-dasharray: 3 3; }
.frise .ep { cursor: pointer; }
.frise .ep.choisi { stroke: var(--encre); stroke-width: 1.5; }
.frise .ligne-hab.touche .nom { fill: var(--alerte); }
.aide { font-size: .8rem; color: var(--trait); margin-top: 4px; }

.bas { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.instant h2, .causes h2 { font-family: var(--f-titre); font-weight: 600; font-size: 1rem; margin: 0 0 6px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.instant h2 b { font-family: var(--f-chiffres); font-weight: 500; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.pas-nav { display: inline-flex; gap: 2px; }
.pas-nav button { border: 1px solid var(--regle); background: var(--planche); padding: 0 7px; border-radius: 3px; cursor: pointer; font-size: .8rem; }
.hab { border-top: 1px solid var(--trait-fin); padding: 7px 0; display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 2px 10px; }
.hab .qui { font-family: var(--f-titre); font-weight: 600; }
.hab .qui small { display: block; font-weight: 400; font-size: .72rem; color: var(--trait); text-transform: uppercase; letter-spacing: .06em; }
.monde { font-size: .9rem; }
.monde .ou { color: var(--trait); }
.monde .action { color: var(--trait); font-size: .85rem; }
.monde.joue { border-left: 3px solid var(--alerte); padding-left: 8px; margin-top: 4px; }
.monde.joue .etiq { color: var(--alerte); }
.identique { font-size: .8rem; color: var(--trait); }
.faits-actifs { grid-column: 2; margin: 4px 0 0; padding-left: 16px; font-size: .85rem; }
.faits-actifs li::marker { color: var(--alerte); }

.causes ul { list-style: none; margin: 0; padding-left: 16px; border-left: 1px solid var(--trait-fin); }
.causes > ul { padding-left: 0; border-left: none; }
.causes li { margin: 3px 0; }
.causes .noeud { all: unset; cursor: pointer; display: block; font-size: .88rem; line-height: 1.35; padding: 2px 4px; border-radius: 3px; }
.causes .noeud:hover, .causes .noeud:focus-visible { background: var(--papier); outline: none; }
.causes .noeud.choisi { background: var(--papier); box-shadow: inset 3px 0 0 var(--laiton); }
.causes .noeud .q { font-weight: 600; }
.causes .noeud .t { font-family: var(--f-chiffres); font-size: .78rem; color: var(--trait); }
.causes .noeud .g { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.causes .racine > .noeud { font-weight: 600; color: var(--alerte); }
.causes .via { color: var(--trait); font-style: italic; }
.vide { color: var(--trait); font-size: .9rem; }

@media (max-width: 860px) {
  .resume, .bas { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <header class="bandeau">
    <h1>Le voyageur <span>— deux mondes, un écart</span></h1>
    <a href="index.html">La semaine en fil de fer</a>
  </header>
  <nav class="groupe" id="scenarios" aria-label="Scénario du voyageur"><span class="etiq">Scénario</span></nav>
  <section class="carte resume" id="resume" aria-live="polite"></section>
  <section class="carte frise">
    <div class="frise-tete">
      <div class="groupe" id="zoom" aria-label="Période affichée"><span class="etiq">Période</span></div>
      <div class="legende" id="legende"></div>
    </div>
    <svg id="svg" role="img" aria-label="Frise des faits différents, habitant par habitant" tabindex="0"></svg>
    <div class="aide">Cliquer sur la frise choisit l'instant ; les flèches avancent de 5 minutes (Maj : d'une heure). Chaque bande est un fait qui diffère du monde de référence ; les traits rouges sont les interventions du voyageur.</div>
  </section>
  <div class="bas">
    <section class="carte instant" id="instant" aria-live="polite"></section>
    <section class="carte causes" id="causes"></section>
  </div>
</div>
<script src="divergence.js"></script>
<script>
const D = window.DIVERGENCE;
const T = D.textes, PJ = D.pas_par_jour, NJ = D.dates.length, N = PJ * NJ;
const JOURS = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
const GENRES = [
  { id: "corps", nom: "endroit, activité", g: ["lieu", "activité"], c: "var(--brique)" },
  { id: "rencontre", nom: "rencontres", g: ["rencontre"], c: "var(--verre)" },
  { id: "chose", nom: "objets, achats", g: ["objet", "achat"], c: "var(--laiton)" },
  { id: "savoir", nom: "ce qu'on a appris", g: ["appris"], c: "var(--mousse)" },
  { id: "anomalie", nom: "anachronismes", g: ["anomalie"], c: "var(--violet)" },
];
const voie = g => GENRES.findIndex(x => x.g.includes(g));
const couleurVerdict = v => v.startsWith("paradoxe") ? "var(--alerte)" : v.startsWith("en cascade") ? "var(--brique)" :
  v.startsWith("persistante") ? "var(--laiton)" : v.startsWith("absorbée") ? "var(--verre)" : "var(--mousse)";
const el = (tag, attrs = {}, txt) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; return e; };
const svgEl = (tag, attrs = {}) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const hm = k => { const m = (k % PJ) * 5; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
const jour = k => { const d = new Date(D.dates[Math.floor(k / PJ)] + "T12:00"); return `${JOURS[(d.getDay() + 6) % 7]} ${d.getDate()}`; };
// fin d'un épisode (son dernier pas compris) : l'heure, le jour s'il change, ou la fin de la semaine
const finEp = f => { const k = f.fin + 1; if (k >= N) return "fin de la semaine"; return (Math.floor(k / PJ) !== Math.floor(f.debut / PJ) ? jour(k) + " " : "") + hm(k); };
const prenom = id => (D.habitants.find(h => h.id === id) || {}).prenom || id;

let S = null, debut = 0, fin = N, curseur = 0, choisi = null;
try { const m = /scenario=([\w-]+)/.exec(location.hash); if (m) S = D.scenarios.find(s => s.id === m[1]); } catch (e) {}
S = S || D.scenarios.find(s => s.id === "belote") || D.scenarios[0];

// ---------------------------------------------------------------- scénarios
const nav = document.getElementById("scenarios");
for (const s of D.scenarios) {
  const b = el("button", { type: "button", "aria-pressed": "false", title: s.verdict });
  const p = el("span", { class: "pastille" }); p.style.background = couleurVerdict(s.verdict);
  b.append(p, document.createTextNode(s.id)); b.onclick = () => choisir(s); s.bouton = b; nav.append(b);
}
const leg = document.getElementById("legende");
for (const g of GENRES) { const s = el("span"); const i = el("i"); i.style.background = g.c; s.append(i, document.createTextNode(g.nom)); leg.append(s); }

function choisir(s) {
  S = s; choisi = null;
  for (const x of D.scenarios) x.bouton.setAttribute("aria-pressed", x === s ? "true" : "false");
  try { history.replaceState(null, "", "#scenario=" + s.id); } catch (e) {}
  const premier = s.racines.length ? s.racines[0].pas : 0;
  curseur = premier;
  periode(s.racines.length ? "6h" : -1);
  resume(); zooms(); causes(); dessiner(); instant();
}

function resume() {
  const R = document.getElementById("resume"); R.textContent = "";
  const v = el("div", { class: "verdict" }); const p = el("span", { class: "pastille" }); p.style.background = couleurVerdict(S.verdict);
  v.append(p, el("span", {}, S.verdict.charAt(0).toUpperCase() + S.verdict.slice(1) + "."));
  const g = el("div"); g.append(el("p", {}, S.description));
  if (S.attendu) g.append(el("p", { class: "attendu" }, S.attendu));
  if (S.porte.length) g.append(el("p", { class: "porte" }, "Le voyageur porte : " + S.porte.join(", ").replaceAll("_", " ") + "."));
  const d = el("div"); d.append(el("div", { class: "etiq" }, "Ce que le voyageur a fait"));
  const ul = el("ul");
  for (const x of S.voyageur) ul.append(el("li", {}, `${jour((D.dates.indexOf(x.date)) * PJ)} ${x.heure} : ${x.action}`));
  if (!S.voyageur.length) ul.append(el("li", {}, "rien"));
  d.append(ul); R.append(v, g, d);
}

// ---------------------------------------------------------------- période
// période affichée : la semaine (j = -1), un jour (j = 0…6), ou six heures autour de l'instant (j = "6h")
let mode = -1;
function periode(j) {
  mode = j;
  if (j === "6h") { debut = Math.max(0, Math.min(N - 72, Math.floor((curseur - 6) / 12) * 12)); fin = debut + 72; }   // à l'heure ronde
  else if (j < 0) { debut = 0; fin = N; } else { debut = j * PJ; fin = debut + PJ; }
}
// l'instant sort de la période : on la suit (même genre de période)
function suivre() { if (curseur < debut || curseur >= fin) { periode(mode === "6h" ? "6h" : mode < 0 ? -1 : Math.floor(curseur / PJ)); zooms(); } }
function zooms() {
  const Z = document.getElementById("zoom"); Z.querySelectorAll("button").forEach(b => b.remove());
  const ajouter = (txt, j) => {
    const b = el("button", { type: "button", "aria-pressed": String(mode === j) }, txt);
    b.onclick = () => { if (j !== "6h" && j >= 0 && Math.floor(curseur / PJ) !== j) curseur = j * PJ + 96; periode(j); zooms(); dessiner(); instant(); };
    Z.append(b);
  };
  ajouter("6 h", "6h");
  ajouter("semaine", -1);
  D.dates.forEach((d, j) => ajouter(jour(j * PJ), j));
}

// ---------------------------------------------------------------- frise
const svg = document.getElementById("svg");
const H_LIGNE = 44, TETE = 26, VOIE = 6;
let G = 92;
function dessiner() {
  const W = svg.clientWidth || 900, H = TETE + H_LIGNE * D.habitants.length + 6;
  G = W < 560 ? 66 : 92;   // la colonne des noms se resserre sur un écran étroit
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.style.height = H + "px"; svg.textContent = "";
  const x = k => G + (k - debut) / (fin - debut) * (W - G - 6);
  // nuits (22:00 → 06:00) et repères d'heures
  for (let j = Math.floor(debut / PJ); j <= Math.floor((fin - 1) / PJ); j++) {
    for (const [a, b] of [[0, 72], [264, 288]]) {
      const x0 = Math.max(x(j * PJ + a), G), x1 = Math.min(x(j * PJ + b), W - 6);
      if (x1 > x0) svg.append(svgEl("rect", { class: "nuit", x: x0, y: TETE, width: x1 - x0, height: H - TETE - 6 }));
    }
  }
  // un repère par jour (semaine), sinon toutes les deux heures, ou quatre sur un écran étroit
  const pas = fin - debut === N ? PJ : fin - debut === 72 ? 12 : (W < 700 ? 48 : 24);
  for (let k = debut; k <= fin; k += pas) {
    svg.append(svgEl("line", { class: "ligne-pas", x1: x(k), x2: x(k), y1: TETE - 4, y2: H - 6 }));
    if (k < fin) {
      const t = svgEl("text", { class: "heure", x: x(k) + 3, y: 14 });
      t.textContent = fin - debut === N ? (W < 700 ? jour(k).slice(0, 3) + "." : jour(k)) : hm(k); svg.append(t);
    }
  }
  // habitants
  const touches = new Set(S.touches);
  D.habitants.forEach((h, n) => {
    const y0 = TETE + n * H_LIGNE;
    const gr = svgEl("g", { class: "ligne-hab" + (touches.has(h.id) ? " touche" : "") });
    const t = svgEl("text", { class: "nom", x: 0, y: y0 + 18 }); t.textContent = h.prenom; gr.append(t);
    const s2 = svgEl("text", { class: "heure", x: 0, y: y0 + 32 });
    s2.textContent = S.cascade.includes(h.id) ? "cascade" : S.cibles.includes(h.id) ? (W < 560 ? "direct" : "touché directement") : ""; gr.append(s2);
    svg.append(svgEl("line", { class: "ligne-pas", x1: G, x2: W - 6, y1: y0 + H_LIGNE - 1, y2: y0 + H_LIGNE - 1 }));
    for (const f of S.faits) {
      if (f.habitant !== h.id || f.fin < debut || f.debut >= fin) continue;
      const v = voie(f.genre), a = Math.max(x(f.debut), G), b = Math.min(x(f.fin + 1), W - 6);
      const r = svgEl("rect", { class: "ep" + (choisi === f.id ? " choisi" : ""), x: a, y: y0 + 6 + v * (VOIE + 1), width: Math.max(2, b - a), height: VOIE, fill: GENRES[v].c, "data-id": f.id });
      const tt = svgEl("title"); tt.textContent = `${h.prenom}, ${jour(f.debut)} ${hm(f.debut)}${f.fin > f.debut ? " → " + finEp(f) : ""} — ${f.genre} : ${f.detail}`; r.append(tt);
      r.addEventListener("click", ev => { ev.stopPropagation(); choisirFait(f.id); });
      gr.append(r);
    }
    svg.append(gr);
  });
  // interventions du voyageur
  for (const v of S.racines) {
    if (v.pas < debut || v.pas >= fin) continue;
    svg.append(svgEl("line", { class: "intervention", x1: x(v.pas), x2: x(v.pas), y1: TETE - 6, y2: H - 6 }));
    const p = svgEl("path", { d: `M${x(v.pas) - 5},${TETE - 12} h10 l-5,7 z`, fill: "var(--alerte)" });
    const tt = svgEl("title"); tt.textContent = `Le voyageur, ${jour(v.pas)} ${hm(v.pas)} — ${v.texte}`; p.append(tt); svg.append(p);
  }
  if (curseur >= debut && curseur < fin) svg.append(svgEl("line", { class: "curseur", x1: x(curseur + .5), x2: x(curseur + .5), y1: TETE - 4, y2: H - 6 }));
  svg.onpointerdown = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    if (px < G) return;
    curseur = Math.max(debut, Math.min(fin - 1, Math.floor(debut + (px - G) / (W - G - 6) * (fin - debut))));
    dessiner(); instant();
  };
}
svg.addEventListener("keydown", ev => {
  const d = ev.key === "ArrowRight" ? 1 : ev.key === "ArrowLeft" ? -1 : 0;
  if (!d) return;
  ev.preventDefault();
  curseur = Math.max(0, Math.min(N - 1, curseur + d * (ev.shiftKey ? 12 : 1)));
  suivre();
  dessiner(); instant();
});
window.addEventListener("resize", () => dessiner());

// ---------------------------------------------------------------- l'instant
function instant() {
  const I = document.getElementById("instant"); I.textContent = "";
  const h2 = el("h2"); h2.append(el("span", { class: "etiq" }, "À cet instant"), el("b", {}, hm(curseur)), document.createTextNode(jour(curseur)));
  const navp = el("span", { class: "pas-nav" });
  for (const [t, d] of [["− 1 h", -12], ["− 5 min", -1], ["+ 5 min", 1], ["+ 1 h", 12]]) {
    const b = el("button", { type: "button" }, t);
    b.onclick = () => { curseur = Math.max(0, Math.min(N - 1, curseur + d)); suivre(); dessiner(); instant(); };
    navp.append(b);
  }
  h2.append(navp); I.append(h2);
  for (const h of D.habitants) {
    const r = D.reference[h.id][curseur], j = S.joue[h.id][curseur];
    const div = el("div", { class: "hab" });
    const q = el("div", { class: "qui" }, h.prenom);
    if (S.cascade.includes(h.id)) q.append(el("small", {}, "par cascade")); else if (S.cibles.includes(h.id)) q.append(el("small", {}, "touché directement"));
    const corps = el("div");
    corps.append(monde(r, "Référence"));
    if (j) corps.append(monde(j, "Monde joué", r)); else corps.append(el("div", { class: "identique" }, "Monde joué : la même chose."));
    div.append(q, corps);
    const actifs = S.faits.filter(f => f.habitant === h.id && f.debut <= curseur && curseur <= f.fin);
    if (actifs.length) {
      const ul = el("ul", { class: "faits-actifs" });
      for (const f of actifs) ul.append(el("li", {}, `${f.genre} : ${f.detail}`));
      div.append(ul);
    }
    I.append(div);
  }
}
function monde(x, titre, ref) {
  const d = el("div", { class: "monde" + (ref ? " joue" : "") });
  d.append(el("div", { class: "etiq" }, titre));
  const l = el("div"); l.append(el("b", {}, T[x[1]]), el("span", { class: "ou" }, " · " + T[x[0]]) );
  if (T[x[3]]) l.append(el("span", { class: "ou" }, " · avec " + T[x[3]]));
  d.append(l, el("div", { class: "action" }, T[x[2]]));
  return d;
}

// ---------------------------------------------------------------- chaîne des causes
function causes() {
  const C = document.getElementById("causes"); C.textContent = "";
  C.append(el("h2", {}, "Chaîne des causes"));
  const enfants = {};
  for (const f of S.faits) (enfants[f.cause] = enfants[f.cause] || []).push(f);
  if (!S.racines.length && !S.faits.length) { C.append(el("p", { class: "vide" }, "Aucune intervention, aucun fait différent.")); return; }
  const ul = el("ul");
  const branche = (f, prof) => {
    const li = el("li");
    const b = el("button", { type: "button", class: "noeud" + (choisi === f.id ? " choisi" : ""), "data-id": f.id });
    const g = el("span", { class: "g" }); g.style.background = GENRES[voie(f.genre)].c;
    b.append(g, el("span", { class: "q" }, prenom(f.habitant)), el("span", { class: "t" }, ` ${jour(f.debut)} ${hm(f.debut)}` + (f.fin > f.debut ? ` → ${finEp(f)}` : "")),
      document.createTextNode(` — ${f.genre} : ${f.detail}`));
    if (f.via) b.append(el("span", { class: "via" }, ` (${f.via})`));
    if (f.supposee) b.append(el("span", { class: "via" }, " (lien supposé)"));
    b.onclick = () => choisirFait(f.id);
    li.append(b);
    const e = enfants[f.id] || [];
    if (e.length && prof < 12) { const u = el("ul"); for (const c of e) u.append(branche(c, prof + 1)); li.append(u); }
    return li;
  };
  for (const v of S.racines) {
    const li = el("li", { class: "racine" });
    const b = el("button", { type: "button", class: "noeud" }, `Le voyageur, ${jour(v.pas)} ${hm(v.pas)} — ${v.texte}`);
    b.onclick = () => { curseur = v.pas; suivre(); dessiner(); instant(); };
    li.append(b);
    const e = enfants[v.id] || [];
    if (e.length) { const u = el("ul"); for (const c of e) u.append(branche(c, 1)); li.append(u); }
    else li.append(el("p", { class: "vide" }, "Aucun fait n'en découle."));
    ul.append(li);
  }
  for (const f of enfants[null] || []) ul.append(branche(f, 0));
  C.append(ul);
}
function choisirFait(id) {
  choisi = id;
  const f = S.faits.find(x => x.id === id);
  curseur = f.debut;
  suivre();
  document.querySelectorAll(".causes .noeud").forEach(b => b.classList.toggle("choisi", b.dataset.id === id));
  dessiner(); instant();
}

choisir(S);
</script>
